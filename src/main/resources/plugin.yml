name: SHVotePunish
version: '${project.version}'
main: org.Cry_Legende.sHVotePunish.SHVotePunish
api-version: '1.20'
author: Cry_Legende
description: Un système de sanction par vote communautaire.
depend: [Vault] # Dépendance obligatoire à Vault

commands:
  votepunish:
    description: Lance un vote pour sanctionner un joueur ou gère le plugin.
    usage: |
      /<command> <joueur>
      /<command> ignore <joueur>
      /<command> unignore <joueur>
      /<command> unpunish <joueur>
    aliases: [punish]

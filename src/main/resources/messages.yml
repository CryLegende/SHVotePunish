vote_cancelled_disconnect: "&7&l« &c&lSGuard &8&l» &cLe vote contre &e{player}&c a été annulé car il s'est déconnecté."

# /shvotepunish sans argument ou avec une sous-commande inconnue. {subcommands} : celles que l'expéditeur peut utiliser
admin_usage: "&7&l« &c&lSGuard &8&l» &cUtilisation : /shvotepunish <{subcommands}>"
# /shvotepunish ignore|unignore|unpunish|info sans joueur. {subcommand}
admin_usage_target: "&7&l« &c&lSGuard &8&l» &cUtilisation : /shvotepunish {subcommand} <joueur>"
# {player} : pseudo tapé
player_never_seen: "&7&l« &c&lSGuard &8&l» &cLe joueur '{player}' n'a jamais été vu sur ce serveur."

# /shvotepunish reload. {file} : fichier illisible, {error} : cause (l'ancienne configuration reste en place)
reload_done: "&7&l« &a&lSGuard &8&l» &7Configuration et messages rechargés."
reload_error: "&7&l« &c&lSGuard &8&l» &cRechargement annulé, {file} est illisible : &7{error}"
reload_restart: "&7&l« &6&lSGuard &8&l» &7La section &6reseau &7ne se lit qu'au démarrage : &6redémarrage nécessaire &7pour la changer."

# /shvotepunish list <ignored|punished>. {list} : nom de la liste, {count}, {page}, {pages}, {name}, {uuid}
list_usage: "&7&l« &c&lSGuard &8&l» &cUtilisation : /shvotepunish list <ignored|punished> [page]"
list_header: "&7&l« &e&lSGuard &8&l» &7Liste &e{list} &8({count} joueur(s), page {page}/{pages})"
list_entry: "&8 • &f{name} &8{uuid}"
list_empty: "&7&l« &e&lSGuard &8&l» &7La liste &e{list} &7est vide."


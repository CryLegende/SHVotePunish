# ----------------------------------------------------------------#
#                  Configuration de SHVotePunish                  #
# ----------------------------------------------------------------#
#
# Sanction par vote de la communauté : un joueur lance un vote contre un autre joueur, les autres votent
# depuis un menu, et quand assez de votes sont réunis la commande de sanction est lancée. Le résultat est
# annoncé sur Discord (webhook) et le déroulement du vote est écrit dans le fichier votes de SHLogs.
# Avec SHNetwork, les votes, les menus et les listes valent pour tous les serveurs Opale (voir la section
# 'reseau' en bas du fichier).
#
# Commandes :
#   /votepunish <joueur>             (alias /punish) Lance un vote contre le joueur, ou ouvre le menu du vote en cours.
#   /shvotepunish ignore <joueur>    Interdit au joueur de participer aux votes.
#   /shvotepunish unignore <joueur>  Autorise de nouveau le joueur à participer aux votes.
#   /shvotepunish unpunish <joueur>  Permet de nouveau un vote contre un joueur déjà sanctionné.
#   /shvotepunish import             Avec SHNetwork : copie ignored_players.yml et punished_players.yml dans la base
#                                    du réseau, sans toucher aux joueurs déjà inscrits.
#   /shvotepunish list <ignored|punished>   Liste les joueurs interdits de vote, ou déjà sanctionnés par un vote.
#   /shvotepunish info <joueur>      Dit pourquoi un joueur ne peut pas lancer, voter ou être visé.
#   /shvotepunish reload             Relit config.yml et messages.yml (un fichier illisible ne change rien ; un vote en
#                                    cours garde ses réglages ; la section reseau demande un redémarrage ; les listes ne
#                                    sont jamais touchées).
#   Les anciennes formes /votepunish ignore|unignore|unpunish|import <joueur> marchent toujours, avec les mêmes droits.
#
# Permissions (noms réglables dans la section permissions, vérifiées avec Vault) :
#   use                  Lancer un vote et voter (sans cette clé : shvotepunish.use).
#   bypass               Ne peut pas être la cible d'un vote (sans cette clé : shvotepunish.bypass).
#   eligibility_bypass   Ne peut pas être la cible d'un vote.
#   admin                Toutes les sous-commandes de /shvotepunish (shvotepunish.admin par défaut). Chaque
#                        sous-commande a aussi son nœud <admin>.<sous-commande> : shvotepunish.admin.ignore,
#                        .unignore, .unpunish, .import, .reload, .list, .info.
#
# Les messages sont dans messages.yml ; les textes des menus dans les sections confirmation_menu et vote_menu.

# Paramètres généraux du vote
vote:
  # Commande à exécuter quand un vote réussit. Placeholders: {player}, {uuid}
  command_on_success: "mute {player} 1h Comportement inapproprié"

  # Durée en secondes avant qu'un vote n'expire s'il n'atteint pas le nombre requis.
  duration: 120

  # Nombre de votes requis.
  # "type" peut être 'FIXED' ou 'PERCENTAGE'.
  # Si 'FIXED', "value" est le nombre de votes nécessaires.
  # Si 'PERCENTAGE', "value" est le pourcentage de joueurs en ligne (non-AFK) requis.
  required_votes:
    type: 'FIXED'
    value: 3

# Paramètres du menu de confirmation (lancé par /votepunish)
confirmation_menu:
  title: "Voter pour mute {player}"
  confirm_item:
    material: "GREEN_STAINED_GLASS_PANE"
    name: "&a&lValider"
    lore:
      - "&4ᴀᴛᴛᴇɴᴛɪᴏɴ ᴛᴏᴜᴛ ᴀʙᴜѕ ѕᴇʀᴀ ѕᴀɴᴄᴛɪᴏɴɴᴇ"
      - ""
      - "&7&l« &cAucun staff de connecté ? &8&l»"
      - "&8• &7Votez pour sanctionner temporairement &c{player}&7."
      - ""
      - "&8• &7Si le vote réussit, il sera mis en sourdine"
      - "&7et le staff sera averti pour évaluer la situation."
      - ""
      - "&7Lancer un vote pour sanctionner &e{player}&7."
  cancel_item:
    material: "RED_STAINED_GLASS_PANE"
    name: "&c&lAnnuler"
    lore:
      - "&7Annuler cette procédure."

# Paramètres du menu de vote (ouvert aux autres joueurs)
vote_menu:
  title: "Vote pour sanctionner {player}"
  player_head_lore:
    - "&4ᴀᴛᴛᴇɴᴛɪᴏɴ ᴛᴏᴜᴛ ᴀʙᴜѕ ѕᴇʀᴀ ѕᴀɴᴄᴛɪᴏɴɴᴇ"
    - ""
    - "&7&l« &cAucun staff de connecté ? &8&l»"
    - "&8• &7Votez pour sanctionner temporairement &c{player}&7."
    - ""
    - "&8• &7Si le vote réussit, il sera mis en sourdine"
    - "&7et le staff sera averti pour évaluer la situation."
    - ""
    - "&fVotes obtenus : &e{current_votes}&8/&6{required_votes}"
    - ""

# Intégration Discord
discord_webhook:
  # Envoyer un message sur Discord quand un vote réussit.
  enabled: true

  # URL du webhook Discord. Une URL vide ou incorrecte fait échouer l'envoi.
  url: "https://discord.com/api/webhooks/ID/CHANGE_ME"

  # Le nombre maximum de messages récents du joueur à stocker et à afficher.
  last_messages_limit: 10

  # --- Contenu du Message ---
  content:
    # Nom du bot qui envoie le message.
    username: "VoteMute"

    # URL de l'avatar du bot. {player} sera remplacé par le pseudo du joueur sanctionné.
    avatar_url: "https://cravatar.eu/helmavatar/{player}/64.png"

    # --- Contenu de l'Embed (le cadre coloré) ---
    embeds:
      - # Titre principal de l'embed.
        title: "Mute (Vote des joueurs)"

        # Couleur de la barre latérale de l'embed (en format décimal).
        color: 12292096 # Orange

        # Description principale. {punisher_list} sera remplacé par la liste des joueurs ayant voté.
        description: "**Joueurs ayant voté :**\n{punisher_list}"
        
        # Titres des champs de l'embed (le plugin crée lui-même les champs).
        field_title_player: "Joueur sanctionné"
        field_title_first_join: "Première connexion"
        field_title_last_messages: "Derniers messages"

        # Pied de page de l'embed. {current_time} sera remplacé par l'heure de la sanction.
        footer:
          text: "SHVotePunish • {current_time}"

# Permissions vérifiées par le plugin.
permissions:
  # Lancer un vote et voter.
  use: "shvotepunish.use"
  # Ne peut pas être la cible d'un vote.
  bypass: "shvotepunish.bypass"
  # Utiliser /votepunish ignore, unignore et unpunish.
  admin: "shvotepunish.admin"
  # Ne peut pas être la cible d'un vote.
  eligibility_bypass: "shvotepunish.bypass"

# Joueurs qui ne peuvent jamais être la cible d'un vote, même sans permission de bypass.
blacklisted_players:
  - "Steve"
  - "Alex"

# Mode réseau, avec SHNetwork (sans lui, chaque serveur garde ses votes et ses fichiers comme avant).
# Le vote contre un joueur est porté par le serveur où il se trouve au lancement : il compte les votes des joueurs de
# tous les serveurs, applique les immunités avec les vraies permissions du joueur et lance la sanction. Les autres
# serveurs affichent les mêmes annonces et les mêmes menus, et envoient les votes de leurs joueurs au serveur porteur.
# Un joueur qui change de serveur pendant un vote reste la cible : la commande de sanction s'exécute là où il est
# (runFor de SHNetwork), une seule fois pour tout le réseau. Le pourcentage de votes requis se compte sur tous les
# joueurs connectés au réseau. Les listes des joueurs ignorés et sanctionnés sont dans la base, plus dans
# ignored_players.yml et punished_players.yml.
# Demande un redémarrage : tout (actif, canal, base-de-donnees, joueurs-connus).
reseau:
  actif: true
  # Canal du bus SHNetwork des votes ; les changements de listes passent sur <canal>.liste
  canal: votepunish
  # Temps d'attente, en millisecondes, de la réponse du serveur d'un joueur visé avant de répondre « joueur introuvable »
  delai-reponse-ms: 2000
  # Un vote est annulé quand sa cible reste absente du réseau pendant ce nombre de secondes. Un changement de
  # serveur ne compte pas.
  absence-max-secondes: 4
  # Relecture des listes en base, en secondes, pour rattraper un message du bus perdu (0 pour ne jamais relire)
  rechargement-listes-secondes: 120
  # Registre de la première connexion de chaque compte (colonnes name en minuscules, display_name et first_played) :
  # sert à reconnaître un joueur pour ignore, unignore et unpunish, et à la date du webhook
  joueurs-connus:
    # Table du registre, préfixée par sa base
    table: "minecraft.sh_track_firstseen"
  # Base partagée par tous les serveurs : listes dans la table votepunish_players (list, uuid, name, since)
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shvotepunish
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas ne bloque
    # jamais une sanction : elle est appliquée quand même.
    delai-ms: 3000

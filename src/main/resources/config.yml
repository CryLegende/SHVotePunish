  player_not_found: "&7&l« &c&lSGuard &8&l» &cCe joueur n'est pas en ligne."
  no_permission: "&7&l« &c&lSGuard &8&l» &7Vous n'avez pas la permission de faire cela."
  cannot_punish_self: "&7&l« &c&lSGuard &8&l» &cVous ne pouvez pas vous sanctionner vous-même."
  player_has_bypass: "&7&l« &c&lSGuard &8&l» &cVous ne pouvez pas lancer de vote contre ce joueur (immunisé)."
  vote_already_in_progress: "&7&l« &c&lSGuard &8&l» &cUn vote est déjà en cours contre ce joueur."
  vote_start_confirmation: "&7&l« &6&lSGuard &8&l» &7Vous êtes sur le point de lancer un vote contre &e{player}&7."
  vote_broadcast: |-
    &r
    &7&l« &c&lSGuard &8&l» 
    &c{initiator} &fa lancé un vote pour sanctionner &4{target}&7 !
